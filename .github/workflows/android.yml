name: CLICKER GODFORGE Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate Godot and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.5.1
      GODOT_RELEASE: 4.5.1-stable
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Android SDK
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Download Godot 4.5.1 and export templates
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          godot --version
          godot --version | grep -Eq '^4\.5\.1\.stable(\.official\..*)?

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project and validate scripts
        shell: bash
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 240 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-smoke.log"; then
            echo "Godot runtime smoke test reported script errors."
            exit 1
          fi

      - name: Export Android ARM64 debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/CLICKER-GODFORGE-debug.apk" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s build/CLICKER-GODFORGE-debug.apk
          file build/CLICKER-GODFORGE-debug.apk
          ls -lh build/CLICKER-GODFORGE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLICKER-GODFORGE-debug
          path: build/CLICKER-GODFORGE-debug.apk
          if-no-files-found: error
          retention-days: 14


      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project and validate scripts
        shell: bash
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 240 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-smoke.log"; then
            echo "Godot runtime smoke test reported script errors."
            exit 1
          fi

      - name: Export Android ARM64 debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/CLICKER-GODFORGE-debug.apk" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s build/CLICKER-GODFORGE-debug.apk
          file build/CLICKER-GODFORGE-debug.apk
          ls -lh build/CLICKER-GODFORGE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLICKER-GODFORGE-debug
          path: build/CLICKER-GODFORGE-debug.apk
          if-no-files-found: error
          retention-days: 14
